name: "Terraform Deploy & Node Health Report"

on:
  push:
    branches:
      - main
    paths:
      # Triggers only when changes occur in this project directory
      - "ec2-nginx-monitoring/terraform/**"

permissions:
  contents: read

jobs:
  terraform:
    name: "Provision EC2 & Fetch Report"
    runs-on: ubuntu-latest

    # Sets the execution directory for all run steps to your terraform folder
    defaults:
      run:
        working-directory: "ec2-nginx-monitoring/terraform"

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1" # Change to your AWS region if different

    steps:
      # 1. Clone repository files onto the runner machine
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Terraform CLI on the runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # 3. Initialize backend (S3) and provider plugins
      - name: Terraform Init
        run: terraform init

      # 4. Preview resource changes
      - name: Terraform Plan
        run: terraform plan

      # 5. Provision EC2 instance and bootstrap Nginx + monitor.sh
      - name: Terraform Apply
        run: terraform apply -auto-approve

      # 6. Poll Nginx until report.txt is fully generated and ready
      - name: Retrieve Node Health Report
        run: |
          EC2_IP=$(terraform output -raw public_ip)
          echo "Connecting to instance at: http://$EC2_IP"

          # Loop for up to 2 minutes (24 attempts x 5 seconds)
          for i in {1..24}; do
            if curl -s -f "http://$EC2_IP/report.txt" -o report.txt; then
              echo "Successfully retrieved report!"
              break
            fi
            echo "Attempt $i: Report not ready yet, retrying in 5 seconds..."
            sleep 5
          done

          echo "=== Node Health Report Output ==="
          cat report.txt

      # 7. Save report.txt to GitHub Actions Artifacts
      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ec2-node-health-report
          path: "ec2-nginx-monitoring/terraform/report.txt"
          retention-days: 7

        #8. Destroy the provisioned EC2 instance to avoid incurring costs
      - name: Terraform Destroy
        if: always() # Ensures destroy runs even if previous steps fail
        run: terraform destroy -auto-approve

